<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#020a13">

  <title>Spatial Anatomy XR</title>

  <link
    rel="stylesheet"
    href="./styles.css?v=v2b3b-7"
  >

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">

      <div class="brand-mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div>
        <div class="brand-name">
          Spatial Anatomy <strong>XR</strong>
        </div>

        <div class="brand-subtitle">
          Interactive anatomy explorer
        </div>
      </div>

    </div>

    <div class="model-status">
      <span class="status-dot"></span>
      <span id="statusText">Loading model…</span>
    </div>

  </header>


  <main class="workspace">

    <section class="viewer">

      <div
        id="viewport"
        class="viewport"
      ></div>


      <div class="model-chip">
        A0101 · Skull
      </div>


      <div class="interaction-hint">
        <span>Left drag · Rotate</span>
        <i>•</i>
        <span>Right drag · Pan</span>
        <i>•</i>
        <span>Wheel · Zoom</span>
      </div>


      <aside class="sidebar">

        <!-- SECTION -->
        <section class="control-group">

          <div class="group-heading">

            <div>
              <div class="group-title">
                Section
              </div>

              <div class="group-description">
                Directional anatomical cut
              </div>
            </div>

            <strong
              id="sectionValue"
              class="value"
            >
              0%
            </strong>

          </div>


          <div
            class="direction-row"
            role="group"
            aria-label="Section direction"
          >

            <button
              type="button"
              class="direction-button is-active"
              data-section-axis="y"
              aria-label="Section from top to bottom"
            >
              <span class="direction-icon">↕</span>
              <span>Up / Down</span>
            </button>

            <button
              type="button"
              class="direction-button"
              data-section-axis="z"
              aria-label="Section from front to back"
            >
              <span class="direction-icon">↔</span>
              <span>Front / Back</span>
            </button>

            <button
              type="button"
              class="direction-button"
              data-section-axis="x"
              aria-label="Section from left to right"
            >
              <span class="direction-icon">⇆</span>
              <span>Left / Right</span>
            </button>

          </div>


          <input
            id="sectionSlider"
            class="slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
            aria-label="Section depth"
          >


          <div class="range-labels">
            <span>Full model</span>
            <span>Deep section</span>
          </div>

        </section>


        <!-- APPEARANCE -->
        <section class="control-group">

          <div class="group-title">
            Appearance
          </div>

          <div class="preset-row">

            <button
              type="button"
              data-preset="clinical"
            >
              Clinical
            </button>

            <button
              type="button"
              data-preset="xr"
              class="is-active"
            >
              XR
            </button>

            <button
              type="button"
              data-preset="holo"
            >
              Holo
            </button>

          </div>

        </section>


        <!-- OPACITY -->
        <section class="control-group">

          <div class="group-heading compact-heading">

            <div class="group-title">
              Opacity
            </div>

            <strong
              id="opacityValue"
              class="value"
            >
              78%
            </strong>

          </div>

          <input
            id="opacitySlider"
            class="slider"
            type="range"
            min="30"
            max="100"
            step="1"
            value="78"
            aria-label="Skull opacity"
          >

          <div class="range-labels">
            <span>30%</span>
            <span>100%</span>
          </div>

        </section>


        <!-- ACTIONS -->
        <section class="control-group action-group">

          <div class="action-row">

            <button
              id="resetButton"
              type="button"
            >
              Reset
            </button>

            <button
              id="autoRotateButton"
              type="button"
            >
              Auto rotate
            </button>

          </div>


          <button
            id="arButton"
            type="button"
            class="ar-button"
          >
            <span class="ar-icon">◇</span>
            <span>View in AR</span>
          </button>

        </section>


        <div class="sidebar-footer">

          <div>
            <span>Model</span>
            <strong>A0101</strong>
          </div>

          <div>
            <span>Source</span>
            <strong>MUG500+</strong>
          </div>

        </div>

      </aside>

    </section>

  </main>

</div>


<script
  type="module"
  src="./app.js?v=v2b3b-7"
></script>

</body>
</html>
